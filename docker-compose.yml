version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pulsechat-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsechat-backend
    restart: always
    depends_on:
      - mongodb
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/pulsechat
      - JWT_SECRET=pulsechat_production_quantum_secure_jwt_secret_change_me
      - CLIENT_ORIGIN=http://localhost:3000
      - COOKIE_SECURE=false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsechat-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
